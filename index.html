/* ---- 画面 ---- */

function info(){

    setTimeout(function(){document.body.classList.add('inv')},500);
    setTimeout(win,1000);

}
function win(){

$('undo').onclick=function(){if(done||!hist.length)return;var i=hist.pop();if(K[i]==='c')brk[i]=false;toggle(grid,i);need[i]^=1;moves--;paint(i);info();sfxUndo()};

/* ---- サウンド（Web Audioで生成） ---- */
var AC=null,nb,mix,seBus,bgBus,tb=null,cur=-1,opt=(function(o){var on=!o||o.bgm!==false;return{bgm:on,se:on}})(saved.opt),timer=null,nextT=0,step=0,walk=6;

/* 1: 〜20面 おだやかなアンビエント（これまでの曲） */
var SC0=[55,57,60,62,64,67,69,72,74,76,79],CH0=[[48,55,59,64],[45,52,60,64],[41,48,57,64],[43,50,59,64]],BS0=[48,45,41,43];
function bgm0(st,t,b){
  var s=st%8,bar=Math.floor(st/8)%4;
  if(s===0){CH0[bar].forEach(function(m){tone(m,t,3.6,'sine',.05,b,.9)});tone(BS0[bar],t,1.6,'sine',.16,b,.03);if(bar===0&&Math.random()<.5)walk=5+Math.floor(Math.random()*3)}

  if(Math.random()<(s%2===0?.55:.22)){walk+=[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)];walk=Math.max(2,Math.min(10,walk));tone(SC0[walk],t,1.5,'sine',.14,b,.03)}

/* 2: 21〜40面 冒険（行進のリズムと笛のようなメロディ） */
var CH1=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],BS1=[45,41,48,43],SC1=[69,72,74,76,79,81,84],mo=[],mw=3;
function bgm1(st,t,b){
  var s=st%8,bar=Math.floor(st/8)%4;
  if(s===0&&(bar===0||!mo.length)){mo=[];mw=2+Math.floor(Math.random()*3);for(var i=0;i<8;i++){mw=Math.max(0,Math.min(6,mw+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));mo.push(Math.random()<.22?-1:mw)}}
  else if(s===0)mo[Math.floor(Math.random()*8)]=Math.random()<.2?-1:Math.floor(Math.random()*7);
  if(s===0||s===4){kick(t,b,.5,.3,150,45);tone(BS1[bar]+(s?7:0),t,.4,'triangle',.22,b,.01)}
  if(s===2||s===6){nz(t,.12,.22,2000,b);CH1[bar].forEach(function(m){tone(m,t,.2,'triangle',.07,b,.005)})}

/* 3: 41〜60面 ファンタジー（ハープのアルペジオと鈴の音） */
var CH2=[[60,64,67,71],[62,66,69,72],[57,60,64,67],[55,59,62,66]],BS2=[36,38,33,31],BL2=[72,74,76,79,81,83,86],AR2=[0,1,2,3,4,3,2,1];
function bgm2(st,t,b){

/* 4: 61〜80面 ラップ（ブーンバップ調のビート。声は入りません） */
var BS3=[33,29,31,33],CH3=[[57,60,64,67],[53,57,60,64],[55,59,62,65],[57,60,64,67]],LK3=[69,72,74,76,79,81],lk=2;

/* 5: 81〜100面 クラシック風の交響曲（弦楽器とティンパニの合成音） */
var CH4=[[60,64,67],[65,69,72],[67,71,74],[60,64,67],[60,64,67],[57,60,64],[65,69,72],[67,71,74]],BS4=[36,41,43,36,36,33,41,43],SM=[60,62,64,65,67,69,71,72,74,76,77,79,81,83,84],mp=7,md=1;

var TH=[

function makeBus(th){
  var g=AC.createGain(),lp=AC.createBiquadFilter();g.gain.value=0;lp.type='lowpass';lp.frequency.value=th.lp;g.connect(lp);lp.connect(bgBus);

function paper(t){
  var src=AC.createBufferSource(),hp=AC.createBiquadFilter(),bp=AC.createBiquadFilter(),g=AC.createGain(),f=.95+Math.random()*.1;
